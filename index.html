(()=>{'use strict';const $=s=>document.querySelector(s), money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), today=()=>new Date().toISOString().slice(0,10), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page='home',db={products:[],moves:[],sales:[],settings:{name:'MARIAS',phone:'',address:'',instagram:''}};try{let old=JSON.parse(localStorage.getItem('marias_silver_manager_v2')||'null');if(old)db={...db,...old,settings:{...db.settings,...old.settings}}}catch(e){};db.products=Array.isArray(db.products)?db.products:[];db.moves=Array.isArray(db.moves)?db.moves:[];db.sales=Array.isArray(db.sales)?db.sales:[];const save=()=>{try{localStorage.setItem('marias_silver_manager_v2',JSON.stringify(db));return true}catch(e){alert('Não foi possível salvar. Tente uma foto menor ou remova fotos grandes.');return false}},prod=id=>db.products.find(p=>p.id===id), id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), sold=()=>db.sales.filter(s=>s.status!=='Cancelada');function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${head.length}">Nenhum registro ainda.</td></tr>`}</tbody></table></div>`}function btn(t,a){return `<button data-act="${a}">${t}</button>`}function move(pid,type,qty,reason,date=today()){let p=prod(pid);if(!p)throw Error('Peça não encontrada');if(type==='Saída'&&p.stock<qty)throw Error('Estoque insuficiente. Disponível: '+p.stock);p.stock+=type==='Entrada'?qty:-qty;db.moves.push({id:id(),productId:pid,type,qty,reason,date})}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let s=$('#screen');if(page==='home'){let total=sold().filter(x=>x.date===today()).reduce((a,x)=>a+x.total,0);s.innerHTML=`<h2>Visão geral</h2><p class="muted">Resumo da sua loja em um só lugar.</p><div class="metrics"><div class="metric"><span>Peças cadastradas</span><b>${db.products.length}</b></div><div class="metric"><span>Peças em estoque</span><b>${db.products.reduce((a,p)=>a+Number(p.stock||0),0)}</b></div><div class="metric"><span>Vendas hoje</span><b>${money(total)}</b></div><div class="metric"><span>Vendas registradas</span><b>${sold().length}</b></div></div><div class="panel"><h3>Acesso rápido</h3>${btn('+ Cadastrar peça','newproduct')}${btn('+ Entrada / saída','newmove')}${btn('+ Registrar venda','newsale')}</div><div class="panel"><h3>Estoque atual</h3>${table(['Peça','Estoque','Preço'],db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td><td>${money(p.price)}</td></tr>`))}</div>`}
if(page==='products'){s.innerHTML=`<h2>Cadastro de peças</h2><p class="muted">Cadastre produtos e acompanhe o estoque.</p><div class="panel"><form id="productform"><div class="grid"><div><label>Nome da peça *</label><input name="name" required></div><div><label>Código</label><input name="code"></div><div><label>Categoria</label><select name="category"><option>Anel</option><option>Aliança</option><option>Brinco</option><option>Colar</option><option>Pulseira</option><option>Pingente</option><option>Conjunto</option><option>Outros</option></select></div><div><label>Material</label><input name="material" value="Prata 925"></div><div><label>Custo (R$)</label><input name="cost" type="number" min="0" step=".01" value="0"></div><div><label>Preço de venda (R$) *</label><input name="price" type="number" min="0" step=".01" required></div><div><label>Quantidade inicial</label><input name="stock" type="number" min="0" step="1" value="0" required></div></div><p><button class="primary">Salvar peça</button></p></form></div><div class="panel"><h3>Peças cadastradas</h3>${table(['Peça','Código','Categoria','Estoque','Preço','Ação'],db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.code||'—')}</td><td>${esc(p.category||'—')}</td><td>${p.stock}</td><td>${money(p.price)}</td><td>${btn('Excluir','delete:'+p.id)}</td></tr>`))}</div>`;$('#productform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),qty=Number(f.get('stock'));db.products.push({id:id(),name:f.get('name').trim(),code:f.get('code').trim(),category:f.get('category'),material:f.get('material'),cost:Number(f.get('cost')||0),price:Number(f.get('price')),stock:qty});let p=db.products[db.products.length-1];if(qty)db.moves.push({id:id(),productId:p.id,type:'Entrada',qty,reason:'Estoque inicial',date:today()});if(save()){alert('Peça salva!');render()}}}
if(page==='moves'){s.innerHTML=`<h2>Entradas e saídas</h2><div class="panel"><form id="moveform"><div class="grid"><div><label>Peça</label><select name="pid" required>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (estoque ${p.stock})</option>`).join('')}</select></div><div><label>Tipo</label><select name="type"><option>Entrada</option><option>Saída</option></select></div><div><label>Quantidade</label><input name="qty" type="number" min="1" value="1" required></div><div><label>Data</label><input name="date" type="date" value="${today()}" required></div><div><label>Motivo</label><input name="reason"></div></div><button class="primary">Registrar movimentação</button></form></div><div class="panel">${table(['Data','Peça','Tipo','Quantidade','Motivo'],db.moves.slice().reverse().map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(prod(m.productId)?.name||'Peça removida')}</td><td>${esc(m.type)}</td><td>${m.qty}</td><td>${esc(m.reason||'—')}</td></tr>`))}</div>`;$('#moveform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);try{move(f.get('pid'),f.get('type'),Number(f.get('qty')),f.get('reason'),f.get('date'));if(save())render()}catch(err){alert(err.message)}}}
if(page==='sales'){s.innerHTML=`<h2>Vendas</h2><div class="panel"><form id="saleform"><div class="grid"><div><label>Cliente</label><input name="customer"></div><div><label>Data</label><input name="date" type="date" value="${today()}" required></div><div><label>Peça</label><select name="pid">${db.products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (estoque ${p.stock})</option>`).join('')}</select></div><div><label>Quantidade</label><input name="qty" type="number" min="1" value="1" required></div><div><label>Pagamento</label><select name="payment"><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Transferência</option><option>Outro</option></select></div></div><button class="primary">Concluir venda e gerar recibo</button></form></div><div class="panel">${table(['Data','Nº venda','Cliente','Itens','Total','Recibo'],db.sales.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.number)}</td><td>${esc(x.customer||'Não informado')}</td><td>${x.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</td><td>${money(x.total)}</td><td>${btn('Ver recibo','receipt:'+x.id)}</td></tr>`))}</div>`;$('#saleform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=prod(f.get('pid')),qty=Number(f.get('qty'));if(!p){alert('Cadastre uma peça com estoque antes de vender.');return}if(!Number.isInteger(qty)||qty<1||p.stock<qty){alert('Quantidade inválida ou estoque insuficiente.');return}move(p.id,'Saída',qty,'Venda',f.get('date'));let sale={id:id(),number:'M-'+Date.now().toString().slice(-8),date:f.get('date'),customer:f.get('customer'),payment:f.get('payment'),items:[{name:p.name,qty,price:p.price,pid:p.id}],total:qty*p.price,status:'Concluída'};db.sales.push(sale);if(save()){alert('Venda salva!');render()}}}
if(page==='receipts'){s.innerHTML=`<h2>Recibos</h2><p class="muted">Recibos das vendas registradas.</p><div class="panel">${table(['Número','Data','Cliente','Total','Ação'],db.sales.slice().reverse().map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.date)}</td><td>${esc(x.customer||'Não informado')}</td><td>${money(x.total)}</td><td>${btn('Abrir recibo','receipt:'+x.id)}</td></tr>`))}</div>`}
if(page==='reports'){s.innerHTML=`<h2>Relatórios</h2><p class="muted">Relatório legível para abrir ou imprimir. Os dados ficam neste navegador.</p><div class="panel"><h3>Estoque</h3>${table(['Peça','Código','Categoria','Quantidade','Custo','Preço','Valor do estoque'],db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.code||'—')}</td><td>${esc(p.category||'—')}</td><td>${p.stock}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${money(p.stock*p.cost)}</td></tr>`))}<button class="primary" data-act="report">Gerar relatório completo (HTML)</button><button data-act="csv">Exportar estoque (CSV)</button></div><div class="panel"><h3>Vendas por mês</h3><div class="grid"><div><label>Ano</label><select id="ryear">${Array.from({length:7},(_,i)=>new Date().getFullYear()-i).map(y=>`<option>${y}</option>`).join('')}</select></div><div><label>Mês</label><select id="rmonth">${Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${new Date(2000,i,1).toLocaleString('pt-BR',{month:'long'})}</option>`).join('')}</select></div></div><div id="monthly"></div></div>`;function month(){let ym=$('#ryear').value+'-'+$('#rmonth').value,ss=sold().filter(x=>x.date.startsWith(ym));$('#monthly').innerHTML=`<p>${ss.length} vendas · Total ${money(ss.reduce((a,x)=>a+x.total,0))}</p>`+table(['Data','Venda','Cliente','Total'],ss.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.number)}</td><td>${esc(x.customer||'—')}</td><td>${money(x.total)}</td></tr>`))}$('#ryear').onchange=month;$('#rmonth').onchange=month;$('#rmonth').value=String(new Date().getMonth()+1).padStart(2,'0');month()}
if(page==='settings'){s.innerHTML=`<h2>Dados da loja</h2><div class="panel"><form id="settingsform"><label>Nome da loja</label><input name="name" value="${esc(db.settings.name)}"><label>Telefone</label><input name="phone" value="${esc(db.settings.phone)}"><label>Instagram</label><input name="instagram" value="${esc(db.settings.instagram)}"><label>Endereço</label><textarea name="address">${esc(db.settings.address)}</textarea><button class="primary">Salvar dados</button></form></div>`;$('#settingsform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.settings={name:f.get('name'),phone:f.get('phone'),instagram:f.get('instagram'),address:f.get('address')};if(save())alert('Dados salvos!')}}}
function receipt(idv){let x=db.sales.find(s=>s.id===idv);if(!x)return;let win=window.open('','_blank');if(!win){alert('Permita abrir nova aba para visualizar o recibo.');return}win.document.write(`<html lang="pt-BR"><meta charset="utf-8"><title>Recibo MARIAS</title><style>body{font:16px Arial;max-width:650px;margin:30px auto;color:#123}h1{text-align:center}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px}</style><h1>${esc(db.settings.name||'MARIAS')}</h1><h2>RECIBO ${esc(x.number)}</h2><p>Data: ${esc(x.date)}<br>Cliente: ${esc(x.customer||'Não informado')}<br>Pagamento: ${esc(x.payment)}</p>${table(['Peça','Qtd.','Preço','Subtotal'],x.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`))}<h2>Total: ${money(x.total)}</h2><p>${esc(db.settings.phone)} ${esc(db.settings.instagram)}<br>${esc(db.settings.address)}</p><button onclick="print()">Imprimir / salvar PDF</button></html>`);win.document.close()}
function download(text,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}function report(){let html=`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório MARIAS</title><style>body{font:15px Arial;margin:25px;color:#18304d}h1,h2{color:#123b70}table{width:100%;border-collapse:collapse;margin:10px 0 25px}td,th{border:1px solid #cbd8e5;padding:7px;text-align:left}th{background:#dce9f7}</style><h1>${esc(db.settings.name)} — Relatório da loja</h1><p>Gerado em ${new Date().toLocaleString('pt-BR')}</p><h2>Estoque atual</h2>${table(['Peça','Código','Categoria','Quantidade','Custo','Preço','Valor em estoque'],db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.code)}</td><td>${esc(p.category)}</td><td>${p.stock}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${money(p.stock*p.cost)}</td></tr>`))}<h2>Vendas</h2>${table(['Data','Número','Cliente','Pagamento','Total','Status'],db.sales.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.number)}</td><td>${esc(x.customer||'—')}</td><td>${esc(x.payment)}</td><td>${money(x.total)}</td><td>${esc(x.status)}</td></tr>`))}<h2>Movimentações</h2>${table(['Data','Peça','Tipo','Quantidade','Motivo'],db.moves.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(prod(m.productId)?.name||'Peça removida')}</td><td>${esc(m.type)}</td><td>${m.qty}</td><td>${esc(m.reason)}</td></tr>`))}</html>`;download(html,'relatorio-marias.html','text/html;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act;if(a==='newproduct'){page='products';render()}else if(a==='newmove'){page='moves';render()}else if(a==='newsale'){page='sales';render()}else if(a.startsWith('delete:')){let x=a.slice(7);if(confirm('Excluir esta peça?')){db.products=db.products.filter(p=>p.id!==x);save();render()}}else if(a.startsWith('receipt:'))receipt(a.slice(8));else if(a==='report')report();else if(a==='csv'){let rows=[['Peça','Código','Categoria','Quantidade','Custo','Preço'],...db.products.map(p=>[p.name,p.code,p.category,p.stock,p.cost,p.price])];download('\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n'),'estoque-marias.csv','text/csv;charset=utf-8')}});$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});render();
})();</script></body></html>
